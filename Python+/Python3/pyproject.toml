# Packaging metadata for the project's own shared helpers, "yaal-helpers"
# (src/yaal_helpers/ -- see its README.md). It sits at the root of Python3/ on purpose: the sources
# have to live under src/, which is the only directory both pytest ("pythonpath = src" in pytest.ini)
# and the IDE already treat as a source root, so the same import resolves everywhere without extra
# configuration. Nothing else here is packaged; the examples are run in place, never installed.
[project]
name = "yaal-helpers"
version = "0.1.0"
description = "Shared helpers for the Python3 examples: file-relative paths, temp paths."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaal_helpers"]
