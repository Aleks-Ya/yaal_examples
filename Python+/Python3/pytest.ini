# Markers "slow" and "fast" for tests/module/thirdparty/PyTest+/pytest/mark/mark_tests_test.py
[pytest]
# "src" makes apps importable as "apps.<name>...".
# "tests" makes cross-test imports work under --import-mode=importlib, which does not add
# anything to sys.path itself (e.g. tests/module/thirdparty/pandas/conftest.py does
# "from module.thirdparty.pandas.data import Person"). "src" is listed first so that its
# regular package src/apps/ wins over the same-named tests/apps/ directory.
pythonpath = src tests
testpaths = tests
# --import-mode=importlib: the examples deliberately reuse one filename across sibling
# package directories (7x detect_language_test.py, 2x current_timezone_test.py, ...).
# The default "prepend" mode derives module names from basenames alone and aborts
# collection with "import file mismatch" on those; importlib gives each file a unique name.
addopts = -m "not integration" --import-mode=importlib
markers =
    slow: slow tests
    fast: fast tests
    integration: connects to 3rd party resources
asyncio_default_fixture_loop_scope = function
