[project]
name = "thirdparty-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yaal-helpers",
    "torch",
    "tensorflow",
    "datasets",
    "huggingface-hub",
    "openai",
    "openai-agents",
    "anthropic",
    "claude-agent-sdk",
    "mcp[cli]",
    "fastmcp",
    "google-genai",
    "tiktoken",
    "lmstudio",
    "ultralytics",
    "scikit-learn",
    "kagglehub[pandas-datasets]",
    "numpy",
    "pandas",
    "pydantic",
    "tabulate",
    "directory-tree",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

# The project's own shared helpers (yaal_helpers.*), installed editable from this
# repository rather than from PyPI -- see src/yaal_helpers/README.md.
[tool.uv.sources]
yaal-helpers = { path = "../../../..", editable = true }
