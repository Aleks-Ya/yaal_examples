[project]
name = "thirdparty-database"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yaal-helpers",
    "chromadb",
    "coverage>=7.15.4",
    "qdrant-client",
    "fastembed"
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

# The project's own shared helpers (yaal_helpers.*), installed editable from this
# repository rather than from PyPI -- see src/yaal_helpers/README.md.
[tool.uv.sources]
yaal-helpers = { path = "../../../..", editable = true }
