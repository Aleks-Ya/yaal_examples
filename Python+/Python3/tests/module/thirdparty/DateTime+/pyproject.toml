[project]
name = "thirdparty-datetime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dateparser",
    "isodate",
    "parsedatetime",
    "pendulum",
    "python-dateutil",
    "pytimeparse",
    "pytimeparse2",
    "pytz",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false
