[project]
name = "thirdparty-pyqt6"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yaal-helpers",
    "PyQt6",
    "PyQtPath",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
]

[tool.uv]
package = false

# The project's own shared helpers (yaal_helpers.*), installed editable from this
# repository rather than from PyPI -- see src/yaal_helpers/README.md.
[tool.uv.sources]
yaal-helpers = { path = "../../../..", editable = true }
